<html lang="ja">
<head>

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f0fdf4;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #bae6fd;
      --accent: #e0f2fe;
      --box-bg: #ecfdf5;
      --box-border: #a7f3d0;
      --box-text: #065f46;
      --indicator-bg: #e0f2fe;
    }

    body.theme-vacuum {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #f0fdfa;
      --box-bg: #f0fdfa;
      --box-border: #99f6e4;
      --box-text: #115e59;
      --indicator-bg: #ccfbf1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      transition: background-color 0.3s ease;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.04);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .mode-switcher {
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      padding: 4px 12px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: bold;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--primary);
      transition: color 0.3s;
    }
    p.lead {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .step-indicator {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--primary);
      background: var(--indicator-bg);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .question-block {
      margin-bottom: 24px;
    }
    .question-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background-color: var(--accent);
    }
    .option-label input {
      margin-right: 12px;
    }
    button.btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
    }
    button.btn:hover {
      background-color: var(--primary-hover);
    }
    .intermediate-box {
      background-color: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .intermediate-box h2 {
      font-size: 1.15rem;
      color: var(--box-text);
      margin-bottom: 12px;
    }
    .product-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
      background: #fff;
    }
    .product-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .badge-silver { background: #475569; }
    .badge-bronze { background: #b45309; }
    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .product-desc {
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 12px;
    }
    .sales-box {
      font-size: 0.85rem;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sales-item strong {
      color: #0f172a;
    }
    .hidden { display: none; }
  </style>
</head>

    <div class="lang-switcher">

    <button type="button" class="btn" style="background-color: #64748b;" id="ui_btn_restart" onclick="restart()"></button>

  function switchCategory(cat) {
    currentCategory = cat;
    p1Answers = {};
    p2Answers = {};

    document.body.className = APP_CONFIG[cat].themeClass;
    document.getElementById('btn_mode_shower').classList.toggle('active', cat === 'shower');
    document.getElementById('btn_mode_vacuum').classList.toggle('active', cat === 'vacuum');

    restart();
  }

  function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase().includes(lang === 'ja' ? '日本' : lang === 'en' ? 'eng' : '中'));
    });

    const cfg = APP_CONFIG[currentCategory];
    const t = cfg.i18n[lang];

    document.getElementById('btn_mode_shower').textContent = APP_CONFIG.shower.i18n[lang].navTitle;
    document.getElementById('btn_mode_vacuum').textContent = APP_CONFIG.vacuum.i18n[lang].navTitle;

    document.getElementById('ui_title').textContent = t.title;
    document.getElementById('ui_lead').textContent = t.lead;
    document.getElementById('ui_p1_indicator').textContent = t.p1Indicator;
    document.getElementById('ui_p2_indicator').textContent = t.p2Indicator;
    document.getElementById('ui_btn_next1').textContent = t.btnNext1;
    document.getElementById('ui_btn_next2').textContent = t.btnNext2;
    document.getElementById('ui_btn_restart').textContent = t.btnRestart;
    document.getElementById('ui_result_title').textContent = t.resultTitle;

    renderQuestionsPhase1();
    renderQuestionsPhase2();

    if (!document.getElementById('phase2').classList.contains('hidden') && document.getElementById('finalResult').classList.contains('hidden')) {
      renderPhase1Summary();
    }
    if (!document.getElementById('finalResult').classList.contains('hidden')) {
      renderFinalResults();
    }
  }

  function renderQuestionsPhase1() {
    const qList = APP_CONFIG[currentCategory].questionsPhase1;
    const container = document.getElementById('p1_questions_container');
    container.innerHTML = qList.map(q => {
      const selectedVal = p1Answers[q.id] || q.options[0].value;
      return `
        <div class="question-block">
          <div class="question-title">${q.title[currentLang]}</div>
          <div class="options-grid">
            ${q.options.map(opt => `
              <label class="option-label">
                <input type="radio" name="${q.id}" value="${opt.value}" ${selectedVal === opt.value ? 'checked' : ''} onchange="p1Answers['${q.id}'] = this.value">
                <span>${opt.label[currentLang]}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderQuestionsPhase2() {
    const qList = APP_CONFIG[currentCategory].questionsPhase2;
    const container = document.getElementById('p2_questions_container');
    container.innerHTML = qList.map(q => {

        </div>

  function submitPhase1() {
    const qList = APP_CONFIG[currentCategory].questionsPhase1;
    qList.forEach(q => {
      const checked = document.querySelector(`input[name="${q.id}"]:checked`);
      p1Answers[q.id] = checked ? checked.value : 'undecided';
    });

    renderPhase1Summary();
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase2').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

          if (rankType === "second") return { pitch: `采用截然不同设计理念的有力对标方案。`, diff: `相比第一候选 ${firstItem.name.zh}，在${p.autoEmpty ? '自动集尘基站免倒灰' : p.dustType === 'pack' ? '密封纸袋不扬尘' : p.wet ? '吸洗湿拖一体' : '超轻量防缠毛'}上展现出专属特长。`, closing: `导购询问：“您更倾向于选购带有${p.autoEmpty ? '自动集尘底座' : p.dustType === 'pack' ? '卫生纸袋尘袋' : '极致轻巧机身'}的型号吗？”` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `适当提高预算、获取更高阶全能享受的进阶参考。` : `精简次要功能、在亲民实惠预算内扎实满足日常吸尘的高性价比备选。`, diff: `与第一候选差价为 ¥${Math.abs(p.price - firstItem.price).toLocaleString()}。`, closing: isHigher ? `导购询问：“是否希望每天清扫彻底省去倾倒尘盒与水洗滤网的麻烦？”` : `导购询问：“是否希望将节省下来的预算用于添置其他高品质生活家电？”` };
        } else {
          if (rankType === "first") return { pitch: `${p.point.ja} お客様のご要望に最も合致する本命モデルです。`, diff: `この価格帯において、軽さ・吸引力・ゴミ捨ての手間のバランスが最も優れています。`, closing: `「普段の掃除で一番ストレスを感じる点（重さ、ゴミ捨ての手間、髪の毛の絡みなど）はどこですか？」とお伺いし、この商品の強みをお伝えください。` };
          if (rankType === "second") return { pitch: `第一候補とは異なるアプローチを持つ有力な対抗モデルです。`, diff: `第一候補の${firstItem.name.ja}に比べ、${p.price > firstItem.price ? '付加機能の充実度や自動化' : '本体の軽さやコストパフォーマンス'}に特徴があります。`, closing: `「掃除機は${p.autoEmpty ? 'ゴミ捨てを自動化したいですか？' : p.dustType === 'pack' ? 'ホコリに触れず捨てたいですか？' : 'まずは軽さを重視しますか？'}」と価値観を比較案内してください。` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `ご予算を少し上げて、より上位の機能を手に入れたい場合の比較選択肢です。` : `機能をシンプルに絞り込み、手頃なご予算で手軽にスタートできる高コスパ候補です。`, diff: `第一候補との価格差は¥${Math.abs(p.price - firstItem.price).toLocaleString()}です。`, closing: isHigher ? `「せっかく買い替えるなら、ゴミ捨ての手間が数ヶ月不要になるステーション付きにしますか？」とお伺いしてください。` : `「浮いたご予算で、他の日用品や交換用フィルターを揃えませんか？」と選択肢を広げてください。` };
        }
      }
    }

    const container = document.getElementById('productRankings');
    container.innerHTML = uniqueDisplay.map(({ item, role, badgeClass, rankType }) => {
      const talk = generatePitch(item, rankType, firstChoice);
      const uniqueReasons = item.reasons.length > 0 
        ? [...new Set(item.reasons.map(r => r[currentLang]))].slice(0, 3) 
        : [t.fitPointsLabel];

      let metaDetails = "";
      if (currentCategory === 'shower') {
        const stopText = item.stopButton ? t.stopYes : t.stopNo;
        const bubbleText = item.fineBubble ? t.bubbleYes : t.bubbleNo;
        metaDetails = `${t.weightLabel}${item.weight}g ｜ ${stopText} ｜ ${bubbleText}`;
      } else {
        const weightInfo = item.category === "robot" ? t.robotType : `${t.weightLabel}${item.weight}kg`;
        metaDetails = `${weightInfo} ｜ ${t.groupLabel}${item.group}`;
      }

      return `
        <div class="product-card">
          <span class="product-badge ${badgeClass}">${role[currentLang]}</span>
          <div class="product-title">${item.name[currentLang]}</div>
          <div class="product-meta">${t.currency}${item.price.toLocaleString()}${t.taxInc} ｜ ${metaDetails}</div>
          <div class="product-desc">${item.desc[currentLang]}</div>
          <div class="sales-box">
            <div class="sales-item"><strong>${t.salesPitchLabel}</strong> ${talk.pitch}</div>
            <div class="sales-item"><strong>${t.salesDiffLabel}</strong> ${talk.diff}</div>
            <div class="sales-item"><strong>${t.salesClosingLabel}</strong> ${talk.closing}</div>
            <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
              <strong>${t.fitPointsLabel}</strong> ${uniqueReasons.join(" ／ ")}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function restart() {
    p1Answers = {};
    p2Answers = {};
    document.getElementById('finalResult').classList.add('hidden');
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('phase1').classList.remove('hidden');
    setLanguage(currentLang);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener('DOMContentLoaded', () => {
    switchCategory('shower');
  });
</script>

</body>
</html>
