      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #f1f5f9;
      --box-bg: #eff6ff;
      --box-border: #bfdbfe;
      --box-text: #1e40af;
      --indicator-bg: #e0e7ff;
    }

    body.theme-haircare {
      --primary: #db2777;
      --primary-hover: #be185d;
      --bg: #fdf2f8;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #fbcfe8;
      --accent: #fff1f2;
      --box-bg: #fff1f2;
      --box-border: #fecdd3;
      --box-text: #9f1239;
      --indicator-bg: #fce7f3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      transition: background-color 0.3s ease;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.04);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .mode-switcher {
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      padding: 4px 12px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: bold;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--primary);
      transition: color 0.3s;
    }
    p.lead {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .step-indicator {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--primary);
      background: var(--indicator-bg);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .question-block {
      margin-bottom: 24px;
    }
    .question-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background-color: var(--accent);
    }
    .option-label input {
      margin-right: 12px;
    }
    button.btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
    }
    button.btn:hover {
      background-color: var(--primary-hover);
    }
    .intermediate-box {
      background-color: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .intermediate-box h2 {
      font-size: 1.15rem;
      color: var(--box-text);
      margin-bottom: 12px;
    }
    .product-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
      background: #fff;
    }
    .product-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .badge-silver { background: #64748b; }
    .badge-bronze { background: #b45309; }
    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .product-desc {
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 12px;
    }
    .sales-box {
      font-size: 0.85rem;
      background: var(--bg);
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sales-item strong {
      color: #0f172a;
    }
    .hidden { display: none; }
  </style>
</head>

          if (product.brand === "braun" || product.blades >= 5) {
            score += 25;
            reasons.push({ ja: "寝ているヒゲやくせ毛を持ち上げて根元から捉える特殊トリマー", en: "Specialized trimmer lifting and capturing flat-lying stray beards", zh: "主动提起平躺贴面胡须并从根部整齐剪断的精密切剃结构" });
          }
        }

        if (p1Answers.p1_bath === "yes") {
          if (product.wet) {
            score += 20;
            reasons.push({ ja: "お風呂場でのジェル・泡剃りに完全対応した防水仕様", en: "Fully waterproof for wet shaving with gel or foam in shower", zh: "完全防水构造，支持在淋浴时搭配啫喱或泡沫舒适湿剃" });
          } else {
            score -= 30;
          }
        }

        if (p2Answers.p2_cleaner === "yes") {
          if (product.autoClean) {
            score += 35;
            reasons.push({ ja: "ボタン一つで洗浄・除菌・乾燥・充電まで全自動で行う洗浄器付属", en: "Includes smart dock handling cleaning, drying, and charging automatically", zh: "附带全自动清洗中心，一键搞定杀菌去脂、风干与充电" });
          } else {
            score -= 20;
          }
        } else if (p2Answers.p2_cleaner === "no") {
          if (!product.autoClean) score += 10;
        }

        if (p2Answers.p2_charge === "usbc") {
          if (product.usbc) {
            score += 20;
            reasons.push({ ja: "スマホと同じUSB Type-Cケーブルで充電可能", en: "Conveniently rechargeable with universal USB Type-C cables", zh: "支持Type-C直充，出门无需额外多带专有充电器" });
          }
        }

        if (p2Answers.p2_brand !== "any" && p2Answers.p2_brand !== "undecided" && product.brand === p2Answers.p2_brand) {
          score += 25;
          reasons.push({ ja: `ご指名のブランド（${product.brand === 'panasonic' ? 'パナソニック' : product.brand === 'braun' ? 'ブラウン' : 'フィリップス'}）モデル`, en: `Matches preferred brand (${product.brand.toUpperCase()}) engineering`, zh: `符合您所偏好的（${product.brand === 'panasonic' ? '松下' : product.brand === 'braun' ? '博朗' : '飞利浦'}）经典驱动体系` });
        }

        let minB = 0, maxB = 100000;
        if (p1Answers.p1_budget === "under5") { maxB = 6000; }
        else if (p1Answers.p1_budget === "5_15") { minB = 5000; maxB = 16000; }
        else if (p1Answers.p1_budget === "15_30") { minB = 14000; maxB = 32000; }
        else if (p1Answers.p1_budget === "over30") { minB = 30000; }

        if (product.price >= minB && product.price <= maxB) {
          score += 25;
          reasons.push({ ja: "ご希望の予算範囲内にジャストフィット", en: "Fits perfectly within your target budget range", zh: "精准契合您预期的购买预算区间" });
        } else if (product.price > maxB) {
          score -= 30;
        }

        return { ...product, finalScore: score, reasons: reasons };
      });
    } else {
      let pool = products;
      if (p1Answers.p1_category && p1Answers.p1_category !== "undecided") {
        pool = products.filter(p => p.category === p1Answers.p1_category);
      }

      scoredProducts = pool.map(product => {
        let score = 50;
        let reasons = [];

        if (p1Answers.p1_priority === "speed") {
          if (product.subType === "speed") {
            score += 35;
            reasons.push({ ja: "乾燥時間や施術時間を劇的に短縮する強力パワー", en: "Drastically cuts drying and styling time with strong output", zh: "以充沛动力显著缩短吹发及造型等待时间" });
          }
        } else if (p1Answers.p1_priority === "care") {
          if (product.careRank >= 3) {
            score += 35;
            reasons.push({ ja: "髪の水分バランスを整えキューティクルを守る高度な美容技術", en: "Advanced hair care technology protecting cuticles & locking moisture", zh: "先进美发黑科技收紧毛鳞片并长效锁水" });
          }
        } else if (p1Answers.p1_priority === "light") {
          if (product.weight <= 400 || product.subType === "light") {
            score += 35;
            reasons.push({ ja: `わずか約${product.weight}gで手首への負担を大幅軽減`, en: `Lightweight at only ~${product.weight}g prevents hand fatigue`, zh: `机身仅约${product.weight}g大幅减轻手腕手臂负担` });
          } else if (product.weight > 550) {
            score -= 25;
          }
        } else if (p1Answers.p1_priority === "cost") {
          if (product.subType === "cost" || product.price <= 5000) {
            score += 35;
            reasons.push({ ja: "お求めやすい価格設定で抜群のコストパフォーマンス", en: "Accessible pricing delivering outstanding cost-performance", zh: "亲民价格展现出无可挑剔的高性价比" });
          }
        }

        if (p1Answers.p1_scene === "overseas") {
          if (product.overseas) {
            score += 40;
            reasons.push({ ja: "海外旅行・留学先でも変圧器なしで使えるマルチボルテージ仕様", en: "Dual voltage ready for global travel and study abroad without transformers", zh: "出国旅行或留学无需繁琐变压器即可插电即用" });
          } else {
            score -= 50;
          }
        }

        let minB = 0, maxB = 100000;
        if (p1Answers.p1_budget === "under5") { maxB = 5500; }
        else if (p1Answers.p1_budget === "5_15") { minB = 4500; maxB = 16000; }
        else if (p1Answers.p1_budget === "15_30") { minB = 14000; maxB = 32000; }
        else if (p1Answers.p1_budget === "over30") { minB = 30000; }

        if (product.price >= minB && product.price <= maxB) {
          score += 25;
          reasons.push({ ja: "ご希望の予算帯にベストマッチ", en: "Fits comfortably within your target budget range", zh: "精准契合您预期的购买预算区间" });
        } else if (product.price > maxB) {
          score -= 25;
        }

        if (p2Answers.p2_hair_type === "thick_heavy") {
          if (product.subType === "speed" || product.id === "refa_power_straight" || product.id === "khd_m800") {
            score += 30;
            reasons.push({ ja: "毛量が多い・クセが強い髪でもしっかりまとまる大風量・広幅プレート", en: "Wide plates & strong wind capable of taming dense volumes and thick curls", zh: "大风量与宽夹板能轻松驯服发量浓密及粗硬卷曲" });
          }
        } else if (p2Answers.p2_hair_type === "damaged" || p2Answers.p2_hair_type === "fine_soft") {
          if (product.careRank >= 4) {
            score += 30;
            reasons.push({ ja: "熱ダメージを受けやすいデリケートな髪を守るシルクプレート/高浸透ナノイー", en: "Protects delicate, heat-sensitive hair via Silk Plates / High-Penetration nanoe", zh: "通过丝绸涂层或高渗透纳诺怡细心呵护娇嫩脆弱受损发丝" });
          }
        }

        if (p1Answers.p1_category === "iron_curl" && p2Answers.p2_barrel !== "none" && p2Answers.p2_barrel !== "undecided") {
          if (product.barrel === p2Answers.p2_barrel) {
            score += 35;
            reasons.push({ ja: "ご希望のカール感にジャストなバレル太さ", en: "Exact barrel diameter for your desired curl definition", zh: "符合您期望卷度造型的专属卷筒尺寸" });
          } else {
            score -= 20;
          }
        }

        if (p2Answers.p2_weight_pref === "super_light") {
          if (product.weight <= 400) {
            score += 20;
            reasons.push({ ja: "毎日の使用でも腕が疲れない超軽量設計", en: "Ultra-light design that prevents fatigue during daily styling", zh: "长时间每日吹发造型也不会造成手臂酸胀的轻盈体量" });
          } else {
            score -= 15;
          }
        }

        if (p2Answers.p2_power_pref === "cordless_usb") {
          if (product.id === "khr_6420" || product.id === "mhs_1343" || product.id === "refa_finger_st") {
            score += 30;
            reasons.push({ ja: "外出先や電源のない場所でも使えるコードレス・USB仕様", en: "Cordless and USB powered for versatile on-the-go styling", zh: "支持无线充电或移动电源供电，随时随地优雅理发" });
          }
        }

        return { ...product, finalScore: score, reasons: reasons };
      });
    }

    scoredProducts.sort((a, b) => b.finalScore - a.finalScore);

    const firstChoice = scoredProducts[0];
    let secondChoice, thirdChoice;

    if (currentCategory === 'shaver') {
      const altBrand = scoredProducts.filter(p => p.brand !== firstChoice.brand && p.id !== firstChoice.id);
      secondChoice = altBrand.length > 0 ? altBrand[0] : (scoredProducts[1] || scoredProducts[0]);
      const priceDiff = scoredProducts.filter(p => p.id !== firstChoice.id && p.id !== secondChoice.id && Math.abs(p.price - firstChoice.price) > 4000);
      thirdChoice = priceDiff.length > 0 ? priceDiff[0] : (scoredProducts[2] || scoredProducts[1]);
    } else {
      const altBrand = scoredProducts.filter(p => p.id !== firstChoice.id && (p.name.ja.split(' ')[0] !== firstChoice.name.ja.split(' ')[0]));
      secondChoice = altBrand.length > 0 ? altBrand[0] : (scoredProducts[1] || scoredProducts[0]);
      const priceDiff = scoredProducts.filter(p => p.id !== firstChoice.id && p.id !== secondChoice.id && Math.abs(p.price - firstChoice.price) > 3000);
      thirdChoice = priceDiff.length > 0 ? priceDiff[0] : (scoredProducts[2] || scoredProducts[1]);
    }

    const displayProducts = [
      {
        item: firstChoice,
        role: { ja: "🥇 第一候補（本命・お客様の条件に最も適合）", en: "🥇 1st Choice (Best Match for Your Needs)", zh: "🥇 第一候选（最佳契合您的核心诉求）" },
        badgeClass: "", rankType: "first"
      },
      {
        item: secondChoice,
        role: { ja: "🥈 第二候補（別アプローチ・有力対抗案）", en: "🥈 2nd Choice (Alternative Brand & Philosophy)", zh: "🥈 第二候选（不同品牌的有力对标）" },
        badgeClass: "badge-silver", rankType: "second"
      },
      {
        item: thirdChoice,
        role: { ja: "🥉 第三候補（価格・機能グレード違いの比較案）", en: "🥉 3rd Choice (Budget or Tier Comparison)", zh: "🥉 第三候选（价格档次与功能对比参考）" },
        badgeClass: "badge-bronze", rankType: "third"
      }
    ];

    const uniqueDisplay = [];
    const usedIds = new Set();
    for (const d of displayProducts) {
      if (d.item && !usedIds.has(d.item.id)) {
        uniqueDisplay.push(d);
        usedIds.add(d.item.id);
      }
    }

    function generatePitch(p, rankType, firstItem) {
      if (currentCategory === 'shaver') {
        if (currentLang === 'en') {
          if (rankType === "first") return { pitch: `${p.point.en} Best match for your primary shaving requirements.`, diff: `Offers the best harmony of sharp blade performance and contour tracking in this tier.`, closing: `Ask: "Where do you feel the most friction or missed stubble right now—jawline, throat, or density?"` };
          if (rankType === "second") return { pitch: `A strong alternative adopting a distinct driving philosophy.`, diff: `Compared to ${firstItem.name.en}, it offers unique strengths in cutting feel and contour touch.`, closing: `Ask: "Have you ever experienced this brand's mechanism before?" to compare tactile feedback.` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `A premium comparison choice if you wish to invest in higher tiers.` : `A high-value alternative that secures all essentials while keeping costs reasonable.`, diff: `Price difference is ¥${Math.abs(p.price - firstItem.price).toLocaleString()}.`, closing: isHigher ? `Ask: "Would you like to automate cleaning and maintenance completely?"` : `Ask: "Would you prefer to save budget for replacement foils?"` };
        } else if (currentLang === 'zh') {
          if (rankType === "first") return { pitch: `${p.point.zh} 与您的剃须习惯及核心诉求最为吻合的本命之选。`, diff: `在当前价位区间内，刀刃锋利深剃度与面部贴合度达到了极其出色的平衡。`, closing: `导购询问：“您平时剃须最感困扰的是刮不干净、下巴死角残留还是剃后皮肤刺痛？”` };
          if (rankType === "second") return { pitch: `采用截然不同驱动理念的有力竞品。`, diff: `相比第一候选 ${firstItem.name.zh}，在特定剃须触感与死角处理上展现专属特长。`, closing: `导购询问：“您之前体验过该品牌的驱动体系吗？”` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `适当提高预算、获取更高级别享受的进阶参考。` : `精简次要功能、在亲民实惠预算内扎实满足每日剃须的高性价比备选。`, diff: `与第一候选差价为 ¥${Math.abs(p.price - firstItem.price).toLocaleString()}。`, closing: isHigher ? `导购询问：“是否希望彻底省去手动拆洗保养麻烦？”` : `导购询问：“是否希望将节省下来的预算用于替换刀头或日常护理？”` };
        } else {
          if (rankType === "first") return { pitch: `${p.point.ja} お客様のご要望に最も合致する本命モデルです。`, diff: `この価格帯において、刃の切れ味とヘッドの追従バランスが最も優れています。`, closing: `「普段のシェービングで一番ストレスを感じる点はどこですか？」とお伺いし、この商品の強みをお伝えください。` };
          if (rankType === "second") return { pitch: `第一候補とは異なる駆動方式を採用した対抗候補です。`, diff: `第一候補の${firstItem.name.ja}に比べ、肌当たりや剃り味の質感に異なる特徴があります。`, closing: `「これまでにこちらのメーカーをお使いになった経験はありますか？」と使用感を比較案内してください。` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `予算を一段上げて、さらに上位の機能を手に入れたい場合の選択肢です。` : `基本性能をしっかり抑えつつ、ご予算をリーズナブルに抑えたい場合のコスパ候補です。`, diff: `第一候補との価格差は¥${Math.abs(p.price - firstItem.price).toLocaleString()}です。`, closing: isHigher ? `「毎朝の洗浄や刃の手入れの手間をゼロにしたいですか？」と確認してください。` : `「ご予算を優先して、浮いた分を替刃や日用品に充てますか？」と選択肢を広げてください。` };
        }
      } else {
        if (currentLang === 'en') {
          if (rankType === "first") return { pitch: `${p.point.en} Perfectly fulfills your primary styling and care requirement.`, diff: `Achieves the highest balance of thermal control, handling, and finish in this class.`, closing: `Ask: "What frustrates you most about your current routine—styling time, dryness, or weight?"` };
          if (rankType === "second") return { pitch: `A strong alternative offering a different philosophy from the 1st choice.`, diff: `Compared to ${firstItem.name.en}, it offers distinctive advantages in finish and handling.`, closing: `Ask: "Would you prefer to invest more in advanced salon-level hair protection?"` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `A premium comparison choice if you wish to step up to top-tier care features.` : `A high-value alternative to minimize upfront cost while securing essential performance.`, diff: `Price difference with 1st choice is ¥${Math.abs(p.price - firstItem.price).toLocaleString()}.`, closing: isHigher ? `Ask: "Would you like to step up to the flagship tier for long-term hair gloss and health?"` : `Ask: "Would you prefer keeping the budget modest to invest in hair care products?"` };
        } else if (currentLang === 'zh') {
          if (rankType === "first") return { pitch: `${p.point.zh} 与您的美发护发核心诉求高度契合的最佳之选。`, diff: `在当前同级产品中，温控调校、手持舒适感与成型柔顺度达到了最为卓越的平衡。`, closing: `导购询问：“您目前吹风造型时最困扰的是费时间、发丝干枯毛躁还是机身太重？”` };
          if (rankType === "second") return { pitch: `不同于第一候选品牌理念的有力对标方案。`, diff: `相比第一候选 ${firstItem.name.zh}，在机身特性与造型质感上展现出独特优势。`, closing: `导购询问：“您更倾向于选购带有高阶护发黑科技的沙龙级机型，还是优先追求轻便易用？”` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `适当提升预算、体验顶尖奢华美发黑科技的高阶方案。` : `精简次要功能、用更亲民的成本享受舒适美发的性价比方案。`, diff: `与第一候选差价为 ¥${Math.abs(p.price - firstItem.price).toLocaleString()}。`, closing: isHigher ? `导购询问：“既然每天都要使用，是否考虑一步到位选用高阶旗舰款？”` : `导购询问：“是否希望把省下来的预算用在购买高品质护发用品上？”` };
        } else {
          if (rankType === "first") return { pitch: `${p.point.ja} お客様のご要望に最も合致する本命モデルです。`, diff: `この価格帯において、温度制御・扱いやすさ・仕上がりのツヤ感のバランスが最も優れています。`, closing: `「普段乾かしたりセットしていて、一番ストレスを感じる点はどこですか？」とお伺いしてください。` };
          if (rankType === "second") return { pitch: `第一候補とは異なる強みを持つ有力な対抗モデルです。`, diff: `第一候補の${firstItem.name.ja}に比べ、${p.price > firstItem.price ? 'より高度なヘアケア美容機能' : '本体の軽さやコスパ'}に違いがあります。`, closing: `「ヘアケア家電は髪へのダメージケアを最優先しますか、それとも手軽さを重視しますか？」と確認してください。` };
          const isHigher = p.price > firstItem.price;
          return { pitch: isHigher ? `ご予算を少し上げて、より上質な機能を手に入れたい場合の比較選択肢です。` : `機能をシンプルに絞り込み、手頃なご予算で手軽にスタートできる高コスパ候補です。`, diff: `第一候補との差額は¥${Math.abs(p.price - firstItem.price).toLocaleString()}です。`, closing: isHigher ? `「せっかく毎日使うものなので、美髪やツヤ感にこだわって上位機にしますか？」とお伺いしてください。` : `「浮いたご予算で、ヘアオイルやトリートメントを揃えてみませんか？」と提案してください。` };
        }
      }
    }

    const container = document.getElementById('productRankings');
    container.innerHTML = uniqueDisplay.map(({ item, role, badgeClass, rankType }) => {
      const talk = generatePitch(item, rankType, firstChoice);
      const uniqueReasons = item.reasons.length > 0 
        ? [...new Set(item.reasons.map(r => r[currentLang]))].slice(0, 3) 
        : [t.fitPointsLabel];

      let metaDetails = "";
      if (currentCategory === 'shaver') {
        const cleanText = item.autoClean ? t.cleanYes : t.cleanNo;
        const usbText = item.usbc ? t.usbYes : t.usbNo;
        const bladeText = item.type === "travel" && item.blades === 1 ? t.rotaryLabel : `${item.blades}${t.bladesLabel}`;
        metaDetails = `${bladeText} ｜ ${cleanText} ｜ ${usbText}`;
      } else {
        const overseasText = item.overseas ? t.overseasYes : t.overseasNo;
        metaDetails = `${t.weightLabel}${item.weight}g ｜ ${overseasText}`;
      }

      return `
        <div class="product-card">
          <span class="product-badge ${badgeClass}">${role[currentLang]}</span>
          <div class="product-title">${item.name[currentLang]}</div>
          <div class="product-meta">${t.currency}${item.price.toLocaleString()}${t.taxInc} ｜ ${metaDetails}</div>
          <div class="product-desc">${item.desc[currentLang]}</div>
          <div class="sales-box">
            <div class="sales-item"><strong>${t.salesPitchLabel}</strong> ${talk.pitch}</div>
            <div class="sales-item"><strong>${t.salesDiffLabel}</strong> ${talk.diff}</div>
            <div class="sales-item"><strong>${t.salesClosingLabel}</strong> ${talk.closing}</div>
            <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
              <strong>${t.fitPointsLabel}</strong> ${uniqueReasons.join(" ／ ")}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function restart() {
    p1Answers = {};
    p2Answers = {};
    document.getElementById('finalResult').classList.add('hidden');
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('phase1').classList.remove('hidden');
    setLanguage(currentLang);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener('DOMContentLoaded', () => {
    switchCategory('shaver');
  });
</script>

</body>
</html>
