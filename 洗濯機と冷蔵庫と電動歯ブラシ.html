<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Appliance Selector / 家電選定・接客診断 / 家电选购助手</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #eff6ff;
      --badge-bg: #dbeafe;
    }
    body.app-washer {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #eff6ff;
      --badge-bg: #dbeafe;
      --meta-color: #b91c1c;
    }
    body.app-refrigerator {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #f0f9ff;
      --badge-bg: #e0f2fe;
      --meta-color: #b91c1c;
    }
    body.app-oralcare {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #e0f2fe;
      --badge-bg: #bae6fd;
      --meta-color: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      transition: background-color 0.2s;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.04);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .appliance-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .app-tab-btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .app-tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: bold;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--primary);
      transition: color 0.2s;
    }
    p.lead {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .step-indicator {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--primary);
      background: var(--badge-bg);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .question-block {
      margin-bottom: 24px;
    }
    .question-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background-color: var(--accent);
    }
    .option-label input {
      margin-right: 12px;
    }
    button.btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
    }
    button.btn:hover {
      background-color: var(--primary-hover);
    }
    .intermediate-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .intermediate-box h2 {
      font-size: 1.15rem;
      color: #166534;
      margin-bottom: 12px;
    }
    .product-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
      background: #fff;
    }
    .product-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      background: var(--primary);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .badge-silver { background: #475569; }
    .badge-bronze { background: #b45309; }
    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 0.9rem;
      color: var(--meta-color, #b91c1c);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .product-desc {
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 12px;
    }
    .sales-box {
      font-size: 0.85rem;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sales-item strong {
      color: #0f172a;
    }
    .hidden { display: none; }
  </style>
</head>

  <!-- 前半5問 -->
  <div id="phase1">
    <span class="step-indicator" id="ui_p1_indicator">STEP 1 / 2（規格・大まかな方向性の確認）</span>
    <div id="p1_questions_container"></div>
    <button type="button" class="btn" id="ui_btn_next1" onclick="submitPhase1()">方向性と推奨スペックを確認する</button>
  </div>

  <!-- 前半結果 ＋ 後半5問 -->
  <div id="phase2" class="hidden">
    <div class="intermediate-box" id="phase1Summary"></div>
    <span class="step-indicator" id="ui_p2_indicator">STEP 2 / 2（詳細機能・こだわりの絞り込み）</span>
    <div id="p2_questions_container"></div>
    <button type="button" class="btn" id="ui_btn_next2" onclick="submitPhase2()">最終候補の3モデルを診断する</button>
  </div>

    <button type="button" class="btn" style="background-color: #64748b;" id="ui_btn_restart" onclick="restart()">最初からやり直す</button>
  </div>
</div>

  function switchAppliance(app) {

          <div class="product-title">${item.name[currentLang]}</div>
          <div class="product-meta">${t.currency}${item.price.toLocaleString()}${t.taxInc} ｜ ${metaDetail}</div>
          <div class="product-desc">${item.desc[currentLang]}</div>
          <div class="sales-box">
            <div class="sales-item"><strong>${t.salesPitchLabel}</strong> ${talk.pitch}</div>
            <div class="sales-item"><strong>${t.salesDiffLabel}</strong> ${talk.diff}</div>
            <div class="sales-item"><strong>${t.salesClosingLabel}</strong> ${talk.closing}</div>
            <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
              <strong>${t.fitPointsLabel}</strong> ${uniqueReasons.join(" ／ ")}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function restart() {
    document.getElementById('finalResult').classList.add('hidden');
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('phase1').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateUITexts();
  });
</script>

</body>
</html>
